name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dockerized-service/login.html'
      - 'dockerized-service/server.js'
      - 'dockerized-service/Dockerfile'
      - 'dockerized-service/package.json'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: my-dockerized-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        uses: docker/build-push-action@v7
        with:
          context: dockerized-service
          push: true
          build-args: |
            SECRET_MESSAGE=${{ secrets.SECRET_MESSAGE }}
            USERNAME=${{ secrets.USERNAME }}
            PASSWORD=${{ secrets.PASSWORD }}
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --output text \
            --parameters '{"commands":[
              "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)",
              "REGISTRY=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
              "IMAGE=${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}",
              "docker pull ${IMAGE}",
              "docker stop my-container || true",
              "docker rm my-container || true",
              "docker run -d --name my-container -p 80:3000 --restart unless-stopped ${IMAGE}"
            ]}'
