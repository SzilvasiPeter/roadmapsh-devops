name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dockerized-service/login.html'
      - 'dockerized-service/server.js'
      - 'dockerized-service/Dockerfile'
      - 'dockerized-service/package.json'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: my-dockerized-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        uses: docker/build-push-action@v7
        with:
          context: dockerized-service
          push: true
          build-args: |
            SECRET_MESSAGE=${{ secrets.SECRET_MESSAGE }}
            USERNAME=${{ secrets.USERNAME }}
            PASSWORD=${{ secrets.PASSWORD }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Run Ansible playbook
        run: |
          ansible-playbook dockerized-service/docker.yml \
            -i "${{ secrets.ANSIBLE_HOST }}," \
            --private-key <(echo "${{ secrets.SSH_PRIVATE_KEY }}") \
            -u ec2-user \
            -e "account_id=${{ steps.login-ecr.outputs.account-id }}" \
            -e "aws_region=${{ env.AWS_REGION }}" \
            -e "ecr_password=${{ steps.login-ecr.outputs.docker-password }}"
